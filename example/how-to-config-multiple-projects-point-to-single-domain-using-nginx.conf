# Redirect
# Case enter via IP: http://191.10.1.0?ref=123
# Redirect to domain
server {
    listen 80;
    listen [::]:80;
    server_name stackdev.cloud;
    return 301 https://$server_name$request_uri;
}


server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name stackdev.cloud;

    # Certificate
    ssl_certificate /etc/letsencrypt/live/stackdev.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stackdev.cloud/privkey.pem;

    # SSL Protocols (optional)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Pass to WebApp '/'
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ករណី Service Project ផ្សេងគ្នា ប៉ុន្តែចង់ប្រើ Domain តែមួយ
    # Current domain server: https://stackdev.cloud
    # Proxy Pass to API Service: http://127.0.0.1:3001
    # Example: https://stackdev.cloud/api :Proxy Pass: http://127.0.0.1:3001/api
    location /api {
        proxy_pass http://127.0.0.1:3001/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ករណី Service Project ផ្សេងគ្នា ប៉ុន្តែចង់ប្រើ Domain តែមួយ
    # Current domain server: https://stackdev.cloud
    # Proxy Pass to Assets Service: http://127.0.0.1:3001
    # Example: https://stackdev.cloud/assets :Proxy Pass: http://127.0.0.1:3001/assets
    location /assets {
        proxy_pass http://127.0.0.1:3002/assets;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

